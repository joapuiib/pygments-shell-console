[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygments-shell-console"
version = "0.9.0"
description = "Pygments lexers for shell console sessions, with highlighted prompts and git output"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pygments"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/joapuiib/pygments-shell-console"

[project.entry-points."pygments.lexers"]
shellconsole = "pygments_shell_console.shell:ShellConsoleLexer"
git = "pygments_shell_console.git:GitLexer"
git-status = "pygments_shell_console.git:GitStatusLexer"
git-short-status = "pygments_shell_console.git:GitShortStatusLexer"
git-log = "pygments_shell_console.git:GitLogLexer"
git-pretty-log = "pygments_shell_console.git:GitPrettyLogLexer"
git-show = "pygments_shell_console.git:GitShowLexer"
git-branch = "pygments_shell_console.git:GitBranchLexer"
git-merge = "pygments_shell_console.git:GitMergeLexer"

[project.entry-points."pygments.styles"]
shellconsole-style = "pygments_shell_console.style:ShellConsoleStyle"

[tool.hatch.build.targets.wheel]
packages = ["pygments_shell_console"]
